<!--
  데이터 과학 영향력 탐구 — Ⅴ 내 보고서
  © 2026 티쳐무 · 모든 권리 보유
  내 보고서·제출 · 2040년 내 명함 · 우리 반 분포
-->
<script>
/* 서술 칸을 여섯 항목으로 묶는다 (번호 앞자리로 가른다) */
var REPORT_GROUPS = [
  { no: '1', title: '1. 긍정적 영향 서술', tip: '개인의 삶과 사회를 각각' },
  { no: '2', title: '2. 사례 제시',        tip: '누가·언제·무엇을·어떻게 + 어떤 데이터' },
  { no: '3', title: '3. 부정적 영향 서술', tip: '개인의 삶과 사회를 각각' },
  { no: '4', title: '4. 보완 방법 서술',   tip: '개인 · 기술·기업 · 사회·제도' },
  { no: '5', title: '5. 진로 분야 제시',   tip: '분야와 그 까닭' },
  { no: '6', title: '6. 준비 내용 서술',   tip: '데이터 과학과 관련지어' }
];

function groupFields(no) {
  return courseFieldKeys()
    .map(function (k) { return STORE.fields[k]; })
    .filter(function (f) { return !!f; })
    .filter(function (f) { return String(f.no).charAt(0) === no; })
    .sort(function (a, b) { return a.no < b.no ? -1 : 1; });
}

/* ══════════════════════════════════════════════════════════
   ① 내 보고서 · 제출
   ══════════════════════════════════════════════════════════ */
REG({
  id: 'report', tab: 5, title: '📄 내 보고서',
  render: function (host) {
    var f = fieldStat();
    var t = totalScore();
    var spec = JUDGE.spec(STORE.vals);
    var bal = JUDGE.balance(STORE.vals, 60);

    /* 이번 차시에 열린 항목만 보여 주므로 「여섯」 이라고 못박으면 안 된다 */
    var openGroups = REPORT_GROUPS.filter(function (g) { return groupFields(g.no).length > 0; });

    host.appendChild(card('📄 내 보고서', [
      h('p.lead', openGroups.length >= REPORT_GROUPS.length
        ? '여섯 항목을 훑어보고, 빈 곳을 채운 뒤 제출하세요.'
        : '이번 차시에 해당하는 ' + openGroups.length + '개 항목을 훑어보고, 빈 곳을 채운 뒤 제출하세요. ' +
          '(나머지 항목은 다음 차시에 열립니다)'),
      h('div.grid3', [
        h('div.mini-card', [h('h4', '진행률'), h('div.big', progressPct() + '%'),
          bar(progressPct(), progressPct() >= 100)]),
        h('div.mini-card', [h('h4', '쓴 글자 수'), h('div.big', f.chars),
          h('p.small', '기준을 넘긴 칸 ' + f.enough + ' / ' + f.n)]),
        h('div.mini-card', [h('h4', '구체성 뱃지'), h('div.big', spec.got + ' / 5'),
          h('p.small', '활동 점수 ' + t.got + ' / ' + t.max + '점')])
      ]),
      bal.got === 4 ? null : noteBox('<b>양팔 저울이 아직 기울어 있습니다</b> — ' + bal.msg),
      spec.got === 5 ? null : noteBox('<b>구체성 뱃지가 ' + spec.got + '개 켜졌습니다.</b> ' +
        '안 켜진 칸의 이유는 [🎯 사례 구체성] 화면에 나옵니다.')
    ]));

    var rpt = h('div.rpt');
    REPORT_GROUPS.forEach(function (grp) {
      var fds = groupFields(grp.no);
      if (!fds.length) return;          /* 이번 차시 범위가 아닌 항목은 아예 보여 주지 않는다 */
      var box = h('div.card');
      box.appendChild(h('h3', grp.title));
      box.appendChild(h('p.small', grp.tip));
      var list = h('div.rpt');
      fds.forEach(function (fd) {
        var v = getVal(fd.key);
        var n = JUDGE.len(v);
        list.appendChild(h('div.rpt-item', [
          h('div.rpt-no', fd.no + ' ' + fd.title + '  ·  ' + n + '자 / 기준 ' + fd.min + '자' +
            (n >= fd.min ? '  ✓' : '')),
          n ? h('div.rpt-txt', v)
            : h('div.rpt-txt.rpt-miss', '아직 쓰지 않았습니다.')
        ]));
      });
      box.appendChild(list);
      rpt.appendChild(box);
    });
    host.appendChild(rpt);

    /* ── 제출 ── */
    var subBox = h('div');
    function paintSubmit() {
      clear(subBox);
      if (APP.boot.closed) {
        subBox.appendChild(h('div.verdict.show.no', '제출이 마감되었습니다. 선생님께 말씀해 주세요.'));
        return;
      }
      if (APP.state.submitted) {
        subBox.appendChild(h('div.verdict.show.ok',
          '제출했습니다 — ' + APP.state.submitted + '. 고쳐서 다시 제출해도 됩니다.'));
      }
      var st = fieldStat();
      var miss = st.n - st.filled;
      if (miss) {
        subBox.appendChild(h('div.verdict.show.part',
          '아직 비어 있는 칸이 ' + miss + '개 있습니다. 그래도 제출할 수 있지만, 채우는 것이 좋습니다.'));
      }
      var btn = h('button.btn.lg', { type: 'button' }, '📤 제출하기');
      btn.addEventListener('click', function () {
        var missNow = fieldStat().n - fieldStat().filled;
        ask('제출하기',
          (missNow ? '아직 비어 있는 칸이 <b>' + missNow + '개</b> 있습니다.<br>' : '') +
          '제출한 뒤에도 <b>고쳐서 다시 제출</b>할 수 있습니다.',
          function () {
            btn.disabled = true; btn.textContent = '보내는 중…';
            APP.save(true, function () {
              APP.submit(function (r) {
                btn.disabled = false; btn.textContent = '📤 제출하기';
                if (r && r.ok) { toast('제출했습니다. 수고했습니다!'); showScreen('report'); }
                else say('제출하지 못했습니다', (r && r.msg) || '잠시 뒤에 다시 눌러 주세요.');
              });
            });
          }, '제출하기');
      });
      subBox.appendChild(h('div.row', [
        btn,
        h('button.btn.ghost', { type: 'button', onclick: function () { window.print(); } }, '🖨 인쇄 / PDF 저장'),
        inCourse('namecard')
          ? h('button.btn.gray', { type: 'button', onclick: function () { showScreen('namecard'); } }, '💳 내 명함 보기')
          : null
      ]));
    }
    host.appendChild(card('📤 제출', [subBox]));
    paintSubmit();
  }
});

/* ══════════════════════════════════════════════════════════
   ② 2040년 내 명함
   ══════════════════════════════════════════════════════════ */
REG({
  id: 'namecard', tab: 5, title: '💳 2040년 내 명함',
  render: function (host) {
    var c = myCareer();
    var fieldName = getVal('career_field') || '(진로 분야를 아직 정하지 않았습니다)';
    var tags = c ? c.tech.slice(0, 4) : [];
    var job = c && c.jobs.length ? c.jobs[0] : fieldName;

    host.appendChild(card('💳 2040년 내 명함', [
      h('p.lead', '앞에서 쓴 내용으로 만든 명함입니다. 인쇄해서 노트에 붙여도 좋습니다.'),
      h('div.nc', [
        h('div.nc-yr', '2040'),
        h('div.nc-name', APP.state.name || '이름'),
        h('div.nc-job', job),
        h('hr.nc-line'),
        h('div.nc-row', { html: '<b>분야</b>' + fieldName }),
        h('div.nc-row', { html: '<b>다루는 데이터</b>' +
          (getVal('case_data') || '(사례의 데이터를 적으면 여기에 들어옵니다)') }),
        h('div.nc-row', { html: '<b>내가 풀고 싶은 문제</b>' +
          (getVal('neg_soc') || getVal('neg_me') || '(부정적 영향 칸을 채우면 여기에 들어옵니다)') }),
        tags.length ? h('div.nc-tags', tags.map(function (t) { return h('span.nc-tag', t); })) : null
      ]),
      h('div.row', [
        h('button.btn.ghost', { type: 'button', onclick: function () { window.print(); } }, '🖨 인쇄 / PDF 저장'),
        h('button.btn.gray', { type: 'button', onclick: function () { showScreen('report'); } }, '📄 보고서로 돌아가기')
      ]),
      noteBox('이 명함은 <b>약속이 아니라 상상</b>입니다. 바뀌어도 괜찮습니다. ' +
              '다만 지금 쓴 근거가 있으면, 바뀔 때도 근거를 가지고 바꿀 수 있습니다.')
    ]));
  }
});

/* ══════════════════════════════════════════════════════════
   ③ 우리 반 분포 — 이름 없이 개수만
   ══════════════════════════════════════════════════════════ */
REG({
  id: 'classstat', tab: 5, title: '👥 우리 반 분포',
  render: function (host) {
    var box = h('div');
    host.appendChild(card('👥 우리 반 진로 분야 분포', [
      goalBox([
        '누가 무엇을 골랐는지는 <b>알 수 없습니다.</b> 개수만 셉니다.',
        '적은 사람이 <b>세 명보다 적으면 열리지 않습니다</b> — 누가 골랐는지 드러나기 때문입니다.'
      ]),
      box,
      h('div.row', [
        h('button.btn.ghost', { type: 'button', onclick: function () { load(); } }, '↻ 새로 불러오기')
      ]),
      askBox('생각해 볼 것 — <b>우리 반에 아무도 고르지 않은 분야</b>는 무엇이고, 왜 그럴까요? ' +
             '그 분야가 필요 없어서일까요, 아직 우리가 몰라서일까요?'),
      noteBox('이 화면은 <b>익명 집계</b>가 무엇인지 직접 보는 자리이기도 합니다. ' +
              '개수만 세면 개인은 드러나지 않지만, 사람이 적으면 개수만으로도 드러납니다. ' +
              '그래서 세 명이라는 문턱을 두었습니다.')
    ]));

    function load() {
      clear(box);
      box.appendChild(h('p.small', '불러오는 중…'));
      callServer('apiClassStat', [APP.state.token], function (r) {
        clear(box);
        if (!r || !r.ok) {
          box.appendChild(h('div.verdict.show.no', (r && r.msg) || '불러오지 못했습니다.'));
          return;
        }
        if (!r.enough) {
          box.appendChild(h('div.verdict.show.part',
            '아직 ' + r.n + '명이 적었습니다. ' + r.min + '명 이상이 되면 열립니다.'));
          return;
        }
        box.appendChild(h('p.small', '진로 분야를 적은 학생 ' + r.n + '명'));
        box.appendChild(distBars(r.rows));
      });
    }
    load();
  }
});
</script>
