<!--
  데이터 과학 영향력 탐구 — 판정 엔진
  © 2026 티쳐무 · 모든 권리 보유

  ⚠ 이 파일은 node 로 그대로 불러다 시험한다. DOM 을 만들지 말 것.
  ⚠ 여기 있는 판정은 규칙(정규식·낱말 목록)으로 훑는 것이라 사람처럼 읽지 못한다.
     학생 화면에도 그렇게 밝혀 두었고, 최종 채점은 교사가 서술 원문을 읽고 한다.
     그래서 판정은 늘 「왜 그렇게 보았는지」(why)를 함께 돌려준다.
-->
<script>
var JUDGE = {

  /* ── 도움 함수 ───────────────────────────────────────── */
  norm: function (t) { return String(t == null ? '' : t).replace(/^\s+|\s+$/g, ''); },

  /** 공백을 뺀 글자 수 — 「스페이스로 칸 채우기」를 막는다 */
  len: function (t) { return JUDGE.norm(t).replace(/\s/g, '').length; },

  /** 뭉뚱그린 표현을 찾아 돌려준다 */
  vague: function (t) {
    var s = JUDGE.norm(t), out = [];
    for (var i = 0; i < DATA.vague.length; i++) {
      if (s.indexOf(DATA.vague[i]) >= 0) out.push(DATA.vague[i]);
    }
    return out;
  },

  hasAny: function (t, list) {
    var s = JUDGE.norm(t);
    for (var i = 0; i < list.length; i++) if (s.indexOf(list[i]) >= 0) return list[i];
    return '';
  },

  /**
   * 목록에서 가장 긴 것을 찾는다.
   * ⚠ hasAny 는 목록 순서대로 찾으므로 「측정값」 에서 「값」 이 먼저 걸린다.
   *   「답이 낱말 하나뿐인가」 를 볼 때는 가장 긴 것을 봐야 한다.
   */
  hasLongest: function (t, list) {
    var s = JUDGE.norm(t), best = '';
    for (var i = 0; i < list.length; i++) {
      if (s.indexOf(list[i]) >= 0 && list[i].length > best.length) best = list[i];
    }
    return best;
  },

  /** 이름 자리를 대신하는 말 (「여러 기업」 …) — 실제 이름이 함께 없을 때만 탈락시킨다 */
  anon: function (t) { return JUDGE.hasAny(t, DATA.vagueAnon); },
  /** 흐릿한 말 (「요즘」 …) — 판정에는 쓰지 않고 알려 주기만 한다 */
  hedge: function (t) { return JUDGE.hasAny(t, DATA.vagueHedge); },

  /**
   * 실제로 가리킬 수 있는 이름이 들어 있는가.
   * ⚠ 영문은 「Because …」 같은 흔한 낱말이 걸리지 않게 enStop 으로 걸러 낸다.
   */
  nameIn: function (t) {
    var s = JUDGE.norm(t);
    var name = JUDGE.hasAny(s, DATA.orgNames);
    if (name) return { ok: true, why: '「' + name + '」' };
    var hint = JUDGE.hasAny(s, DATA.orgHints);
    if (hint) return { ok: true, why: '「…' + hint + '」 로 끝나는 이름' };
    var m = s.match(/[A-Z][A-Za-z]{2,}/g);
    if (m) {
      for (var i = 0; i < m.length; i++) {
        if (DATA.enStop.indexOf(m[i]) < 0) return { ok: true, why: '「' + m[i] + '」' };
      }
    }
    if (/[가-힣]{2,4}\s*(교수|박사|연구원|기사|대표|선생)/.test(s)) {
      return { ok: true, why: '사람을 가리키는 이름' };
    }
    return { ok: false, why: '' };
  },

  /**
   * 「무엇」 자리의 이름 — 서비스 낱말(앱·서비스·시스템 …) 앞에 두 글자 이상의 이름이 붙었는가.
   * 「지도 앱」·「전자의무기록 시스템」 → 이름으로 본다.
   * 「이 서비스」·「어떤 앱」 → 이름이 아니다(꾸밈말은 modStop 으로 걸러 낸다).
   * 찾으면 「지도 앱」 처럼 붙여서 돌려주고, 없으면 빈 문자열.
   */
  namedService: function (t) {
    var s = JUDGE.norm(t);
    for (var i = 0; i < DATA.serviceWords.length; i++) {
      var w = DATA.serviceWords[i];
      var at = s.indexOf(w);
      while (at >= 0) {
        var before = s.slice(0, at).replace(/[\s·,\-]+$/, '');
        var tok = (before.match(/[가-힣A-Za-z0-9]+$/) || [''])[0];
        if (tok.length >= 2 && DATA.modStop.indexOf(tok) < 0 && DATA.enStop.indexOf(tok) < 0) {
          return tok + ' ' + w;
        }
        at = s.indexOf(w, at + 1);
      }
    }
    return '';
  },

  /* ── 뱃지 ① 누가 ──────────────────────────────────────
     실제로 가리킬 수 있는 이름이 있는가. */
  who: function (t) {
    var s = JUDGE.norm(t);
    if (JUDGE.len(s) < 2) return { ok: false, why: '아직 비어 있습니다. 회사·기관·사람 이름을 적어 주세요.' };
    /* 먼저 이름을 찾는다 — 「네이버·카카오 등 여러 기업이」 처럼 뭉뚱그린 말이 섞여도 통과시킨다 */
    var nm = JUDGE.nameIn(s);
    var an = JUDGE.anon(s);
    if (nm.ok) {
      return { ok: true, why: nm.why + ' — 가리킬 수 있는 이름이 있습니다.' +
                             (an ? ' (「' + an + '」 같은 말은 없어도 됩니다)' : '') };
    }
    if (an) return { ok: false, why: '「' + an + '」 는 이름이 아닙니다. 어느 회사·기관인지 이름을 밝혀 주세요.' };
    var hd = JUDGE.hedge(s);
    if (hd) return { ok: false, why: '「' + hd + '」 만으로는 누구인지 알 수 없습니다. 이름을 적어 주세요.' };
    return { ok: false, why: '이름으로 보이는 말이 없습니다. 「어느 회사·기관·연구팀인가」를 찾아 적어 주세요.' };
  },

  /* ── 뱃지 ② 언제 ────────────────────────────────────── */
  when: function (t) {
    var s = JUDGE.norm(t);
    if (!s) return { ok: false, why: '아직 비어 있습니다. 연도를 적어 주세요.' };
    var m = s.match(/(19|20)\d{2}/);
    if (m) {
      var y = Number(m[0]);
      if (y > 2100) return { ok: false, why: '연도가 이상합니다. 다시 확인해 주세요.' };
      return { ok: true, why: m[0] + '년 — 시점이 분명합니다.', year: y };
    }
    if (/\d{2}\s*년\s*대/.test(s)) return { ok: true, why: '「○○년대」로 시점을 밝혔습니다.' };
    return { ok: false, why: '연도가 없습니다. 「요즘」이 아니라 몇 년 무렵인지 적어 주세요.' };
  },

  /* ── 뱃지 ③ 무엇을 ─────────────────────────────────── */
  what: function (t) {
    var s = JUDGE.norm(t);
    if (JUDGE.len(s) < 4) return { ok: false, why: '아직 짧습니다. 기술이나 서비스의 이름을 적어 주세요.' };
    var an = JUDGE.anon(s);
    if (an && !JUDGE.nameIn(s).ok) {
      return { ok: false, why: '「' + an + '」 는 이름이 아닙니다. 무엇의 이름인지 적어 주세요.' };
    }
    if (JUDGE.len(s) < 8) return { ok: false, why: '무엇인지 알아볼 수 있게 조금 더 적어 주세요. (8자 이상)' };
    /* 「앱·서비스·시스템」 은 앞에 이름이 붙어야 이름이 된다 —
       「지도 앱」 은 통과, 「이 서비스」·「어떤 앱」 은 통과시키지 않는다. */
    var named = JUDGE.namedService(s);
    if (named) return { ok: true, why: '「' + named + '」 — 무엇인지 가리킬 수 있습니다.' };
    /* ⚠ 예전에는 /[A-Za-z0-9]/ 였다 — 숫자나 로마자가 한 글자만 섞여도 통과해 뱃지가 무력해졌다.
       이름·모델명처럼 보이는 낱말(대문자로 시작하는 세 자 이상)만 인정한다. */
    var m = s.match(/[A-Z][A-Za-z0-9]{2,}/g);
    if (m) {
      for (var i = 0; i < m.length; i++) {
        if (DATA.enStop.indexOf(m[i]) < 0) return { ok: true, why: '「' + m[i] + '」 — 이름으로 보입니다.' };
      }
    }
    if (/[「'"]/.test(s)) return { ok: true, why: '이름을 따로 묶어 적었습니다.' };
    return { ok: false, why: '기술·서비스의 이름이 드러나지 않습니다. 「무엇」이라고 부르는지 적어 주세요 ' +
                             '(예: … 앱 / … 시스템 / … 기능).' };
  },

  /* ── 뱃지 ④ 어떻게 ─────────────────────────────────── */
  how: function (t) {
    var s = JUDGE.norm(t), n = JUDGE.len(s);
    if (n < 10) return { ok: false, why: '아직 비어 있거나 너무 짧습니다. (' + n + '자 / 40자 이상)' };
    var an = JUDGE.anon(s);
    if (an && !JUDGE.nameIn(s).ok) {
      return { ok: false, why: '「' + an + '」 를 빼고, 어디서 실제로 무엇을 어떻게 하는지 적어 주세요.' };
    }
    var v = JUDGE.hasAny(s, DATA.howVerbs);
    if (n < 40) {
      return { ok: false, why: '움직임이 드러나게 조금 더 적어 주세요. (' + n + '자 / 40자 이상)' };
    }
    if (!v) return { ok: false, why: '무엇을 하는지가 없습니다. 모으는지·분석하는지·예측하는지를 적어 주세요.' };
    return { ok: true, why: '「' + v + '」 — 어떤 일이 일어나는지 드러납니다.' };
  },

  /* ── 뱃지 ⑤ 어떤 데이터 (데이터 과학 과목이라 한 칸 더) ── */
  data: function (t) {
    var s = JUDGE.norm(t), n = JUDGE.len(s);
    /* ⚠ 이 문턱은 3자다. 5자로 두면 「데이터」(3자) 가 여기서 먼저 걸려,
       아래 「한 낱말로는 알 수 없습니다」 안내가 한 번도 나오지 않는 죽은 코드가 된다. */
    if (n < 3) return { ok: false, why: '아직 비어 있습니다. 쓰인 데이터가 무엇인지 적어 주세요.' };
    var an = JUDGE.anon(s);
    if (an && !JUDGE.nameIn(s).ok) return { ok: false, why: '「' + an + '」 는 데이터 이름이 아닙니다.' };
    var w = JUDGE.hasLongest(s, DATA.dataWords);
    if (!w) return { ok: false, why: '무엇이 데이터인지 드러나지 않습니다. 어떤 기록·수치·영상인지 적어 주세요.' };
    if (s === w) {
      return { ok: false, why: '「' + w + '」 한 낱말로는 알 수 없습니다. 무엇의 기록인지 적어 주세요.' };
    }
    if (n < 15) return { ok: false, why: '어떤 데이터인지 조금 더 적어 주세요. (' + n + '자 / 15자 이상)' };
    return { ok: true, why: '「' + w + '」 — 무엇이 재료인지 알 수 있습니다.' };
  },

  /**
   * 사례 구체성 뱃지 다섯 개.
   * vals = { case_who, case_when, case_what, case_how, case_data }
   */
  specKeys: [
    { key: 'case_who',  badge: '누가',        fn: 'who' },
    { key: 'case_when', badge: '언제',        fn: 'when' },
    { key: 'case_what', badge: '무엇을',      fn: 'what' },
    { key: 'case_how',  badge: '어떻게',      fn: 'how' },
    { key: 'case_data', badge: '어떤 데이터', fn: 'data' }
  ],

  spec: function (vals) {
    vals = vals || {};
    var badges = [], got = 0;
    for (var i = 0; i < JUDGE.specKeys.length; i++) {
      var s = JUDGE.specKeys[i];
      var r = JUDGE[s.fn](vals[s.key]);
      if (r.ok) got++;
      badges.push({ key: s.key, badge: s.badge, ok: r.ok, why: r.why });
    }
    return { badges: badges, got: got, of: JUDGE.specKeys.length };
  },

  /* ── 양팔 저울 ──────────────────────────────────────────
     개인/사회 × 긍정/부정 네 칸. 한쪽만 쓰면 기운다. */
  balanceKeys: [
    { key: 'pos_me',  side: 'pos', label: '개인 긍정' },
    { key: 'pos_soc', side: 'pos', label: '사회 긍정' },
    { key: 'neg_me',  side: 'neg', label: '개인 부정' },
    { key: 'neg_soc', side: 'neg', label: '사회 부정' }
  ],

  balance: function (vals, minLen) {
    vals = vals || {};
    var min = minLen == null ? 60 : minLen;
    var pos = 0, neg = 0, got = 0, per = [];
    for (var i = 0; i < JUDGE.balanceKeys.length; i++) {
      var b = JUDGE.balanceKeys[i];
      var n = JUDGE.len(vals[b.key]);
      var ok = n >= min;
      if (ok) { got++; if (b.side === 'pos') pos++; else neg++; }
      per.push({ key: b.key, label: b.label, side: b.side, len: n, ok: ok });
    }
    var tilt = pos - neg;                       /* +면 긍정 쪽으로 기운다 */
    var msg;
    if (got === 4) msg = '네 칸이 모두 찼습니다. 저울이 수평입니다 — 균형 잡힌 평가입니다.';
    else if (got === 0) msg = '아직 아무 칸도 채우지 않았습니다.';
    else if (tilt > 0) msg = '긍정 쪽으로 기울었습니다. 부정적 영향도 개인과 사회로 나누어 적어 주세요.';
    else if (tilt < 0) msg = '부정 쪽으로 기울었습니다. 긍정적 영향도 개인과 사회로 나누어 적어 주세요.';
    else msg = '개인과 사회 가운데 한쪽이 비어 있습니다.';
    return { got: got, of: 4, pos: pos, neg: neg, tilt: tilt, per: per, msg: msg, level: min };
  },

  /* ── 진로 나침반 ────────────────────────────────────────
     picks = [보기 번호 또는 -1(안 고름)] 열두 개.
     추천에는 반드시 「왜」를 붙인다 — 이유 없는 추천은 하지 않는다. */
  compass: function (picks) {
    picks = picks || [];
    var score = {}, reasons = {}, answered = 0, i;
    for (i = 0; i < DATA.careers.length; i++) { score[DATA.careers[i].key] = 0; reasons[DATA.careers[i].key] = []; }

    for (i = 0; i < DATA.compass.length; i++) {
      var pick = picks[i];
      if (pick == null || pick < 0) continue;
      var opt = DATA.compass[i].opts[pick];
      if (!opt) continue;
      answered++;
      Object.keys(opt.w).forEach(function (k) {
        if (score[k] === undefined) return;         /* 분야에 없는 키는 무시한다 */
        score[k] += opt.w[k];
        if (opt.w[k] >= 2) reasons[k].push(opt.tag);
      });
    }

    var rank = DATA.careers.map(function (c) {
      return { key: c.key, name: c.name, what: c.what, score: score[c.key], reasons: reasons[c.key] };
    });
    rank.sort(function (a, b) { return b.score - a.score || (a.name < b.name ? -1 : 1); });

    var top = rank.slice(0, 3).filter(function (r) { return r.score > 0; });
    top.forEach(function (r) {
      var rs = r.reasons.slice(0, 2);
      r.why = rs.length
        ? rs.join(', ') + ' ' + JOSA.eul(r.name) + ' 골랐습니다.'
        : '고른 답들이 이 분야 쪽으로 조금씩 기울었습니다.';
    });
    return { rank: rank, top: top, answered: answered, of: DATA.compass.length };
  },

  /* ── 역량 격차 ──────────────────────────────────────────
     now = {축키: 1~5}, need = {축키: 1~5} */
  gap: function (now, need) {
    now = now || {}; need = need || {};
    var out = DATA.axes.map(function (a) {
      var n = Number(now[a.key]) || 0;
      var d = Number(need[a.key]) || 0;
      return { key: a.key, name: a.name, hint: a.hint, now: n, need: d, gap: Math.max(0, d - n) };
    });
    out.sort(function (a, b) { return b.gap - a.gap || (a.name < b.name ? -1 : 1); });
    return out;
  },

  /** 서술 칸이 기준 글자 수를 넘겼는가 */
  enough: function (t, min) { return JUDGE.len(t) >= min; }
};

/* ════════════════════════════════════════════════════════════
   한국어 조사 — 분야 이름이 데이터에서 오므로 문장을 미리 정할 수 없다.
   ⚠ 「트」는 초성이 ㅌ 일 뿐 받침이 없어 「마이크로비트가」가 맞다.
      숫자·알파벳은 읽는 소리로 판단한다.
   ════════════════════════════════════════════════════════════ */
var JOSA = {
  digitJong: { '0': true, '1': true, '3': true, '6': true, '7': true, '8': true,
               '2': false, '4': false, '5': false, '9': false },
  /* 영문 한 글자를 우리말로 읽었을 때 받침이 남는가 (엘, 엠, 엔, 알… ) */
  alphaJong: { l: true, m: true, n: true, r: true, b: false, c: false, d: false, e: false,
               f: true, g: false, h: false, i: false, j: false, k: false, o: false, p: false,
               q: false, s: false, t: false, u: false, v: false, w: false, x: false, y: false,
               z: false, a: false },

  /** 마지막 글자에 받침이 있는가 */
  hasJong: function (word) {
    var s = String(word == null ? '' : word).replace(/[\s.,)\]」'"]+$/, '');
    if (!s) return false;
    var ch = s.charAt(s.length - 1);
    var code = ch.charCodeAt(0);
    if (code >= 0xac00 && code <= 0xd7a3) return (code - 0xac00) % 28 !== 0;
    if (/[0-9]/.test(ch)) return !!JOSA.digitJong[ch];
    if (/[A-Za-z]/.test(ch)) return !!JOSA.alphaJong[ch.toLowerCase()];
    return false;
  },

  eun: function (w) { return w + (JOSA.hasJong(w) ? '은' : '는'); },
  i:   function (w) { return w + (JOSA.hasJong(w) ? '이' : '가'); },
  eul: function (w) { return w + (JOSA.hasJong(w) ? '을' : '를'); },
  gwa: function (w) { return w + (JOSA.hasJong(w) ? '과' : '와'); },
  ro:  function (w) {
    /* 받침이 ㄹ 이면 「로」 — 「서울로」 */
    var s = String(w || '');
    var ch = s.charAt(s.length - 1);
    var code = ch.charCodeAt(0);
    if (code >= 0xac00 && code <= 0xd7a3 && (code - 0xac00) % 28 === 8) return w + '로';
    return w + (JOSA.hasJong(w) ? '으로' : '로');
  }
};
</script>
